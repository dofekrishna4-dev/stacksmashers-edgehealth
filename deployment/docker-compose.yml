version: "3.9"
services:
  backend:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://guardian:guardian@db:5432/edgehealth
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=guardian
      - POSTGRES_PASSWORD=guardian
      - POSTGRES_DB=edgehealth
    volumes:
      - ./db-data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"

  frontend:
    build: ../frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
